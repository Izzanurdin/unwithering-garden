<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, minimal-ui">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Unwithering Garden">
    <link rel="apple-touch-icon" href="icon-maskable.png">
    <link rel="manifest" href="manifest.json">
    <title>Garden of Unwithering Flowers</title>
    <link rel="stylesheet" href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
</head>
<body>
    <div class="page-transition"></div>

    <section id="landing-section">
        <div class="content-wrapper">
            <h1>GARDEN OF UNWITHERING FLOWERS</h1>
            <p>Real flowers may wither, but you, my love, your bloom is eternal. You deserve unwithering flowers, and unwithering love.</p>
            <button id="accessBtn" class="btn">ENTER THE GARDEN</button>
        </div>
    </section>

    <section id="garden-section" style="display: none;">
        <div id="garden" class="garden"></div>

        <div id="garden-hint" class="garden-hint"></div>
        
        <div class="controls">
            <button id="backBtn" class="btn" data-target="landing-section">← GO BACK</button>
            <button id="saveBtn" class="btn">SAVE PICTURE</button>
            <button id="resetBtn" class="btn">RESET GARDEN</button>
        </div>

        <div id="secret-modal" class="secret-modal">
            <div class="secret-content">
                <h3>PLANT A SECRET MESSAGE</h3>
                <input type="text" id="secret-input" placeholder="Whisper something to this flower..." maxlength="30" autocomplete="off">
                <div class="secret-actions">
                    <button id="secret-cancel" class="btn-small">CANCEL</button>
                    <button id="secret-submit" class="btn-small">PLANT</button>
                </div>
            </div>
        </div>
    </section>
    <script src="script.js"></script>
</body>
</html>
